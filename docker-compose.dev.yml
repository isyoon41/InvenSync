version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ip_review_postgres
    environment:
      POSTGRES_USER: ip_review
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ip_review_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ip_review"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
